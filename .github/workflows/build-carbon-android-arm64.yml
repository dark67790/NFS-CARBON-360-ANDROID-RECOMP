      - name: Patch - 2D squeeze (HUD, menus, videos) and draw diagnostics in the native renderer
        shell: bash
        run: |
          set -euo pipefail
          NFS="$(dirname "$GITHUB_WORKSPACE")/nfsmw-android"
          python3 - "$NFS/app/src" <<'PY'
          import sys

          root = sys.argv[1]  # nfsmw-android/app/src


          def patch(path, edits):
              s = open(path, encoding="utf-8").read()
              for marker, old, new in edits:
                  if marker in s:
                      print("already applied:", marker)
                      continue
                  n = s.count(old)
                  if n != 1:
                      sys.exit("ANCHOR NOT FOUND (%d times) for %s: %r" % (n, marker, old[:60]))
                  s = s.replace(old, new, 1)
                  print("applied:", marker)
              open(path, "w", encoding="utf-8").write(s)


          D = root + "/nfsmw_nativo_dibujos.cpp"
          patch(D, [
              ("carbon-2d-inc", "#include <cmath>\n", "#include <cmath>\n#include <cstdlib>  // carbon-2d-inc\n#include <map>\n"),
              ("carbon-2d-cvar",
               '"se graban (solo pruebas, para localizar un dibujo)");\n',
               '"se graban (solo pruebas, para localizar un dibujo)");\n'
               '// carbon-2d-cvar: 2D draws (HUD, menus, videos) squeezed to the 16:9 of the pass height, centred, on a wider pass.\n'
               'REXCVAR_DEFINE_BOOL(carbon_2d_diag, false, "Carbon",\n'
               '                    "Every 8 s, list the kinds of draw seen (VS, PS, pixel mode, viewport, pass) with their counts");\n'
               'REXCVAR_DEFINE_STRING(carbon_2d_vs, "", "Carbon",\n'
               '                      "Numbers of the vertex shaders whose draws are squeezed to the centre 16:9 on a wider pass, e.g. 12,13");\n'
               'REXCVAR_DEFINE_BOOL(carbon_2d_sinrecorte, false, "Carbon",\n'
               '                    "Squeeze every draw made with the clipping disabled (screen-pixel draws: videos, perhaps the HUD)");\n'),
              ("carbon-2d-members",
               "  std::string diag_omitir_ps_texto_;\n",
               "  std::string diag_omitir_ps_texto_;\n"
               "  bool carbon_2d_activo_ = false;  // carbon-2d-members\n"
               "  bool carbon_2d_diag_ = false;\n"
               "  bool carbon_2d_sinrecorte_ = false;\n"
               "  std::string carbon_2d_vs_texto_;\n"
               "  std::vector<uint32_t> carbon_2d_vs_;\n"
               "  std::map<std::string, uint64_t> carbon_2d_visto_;\n"
               "  std::chrono::steady_clock::time_point carbon_2d_informe_{};\n"),
              ("carbon-2d-frame",
               "    diag_omitir_ps_texto_ = REXCVAR_GET(nfsmw_nativo_diag_omitir_ps);\n",
               "    diag_omitir_ps_texto_ = REXCVAR_GET(nfsmw_nativo_diag_omitir_ps);\n"
               "    // carbon-2d-frame\n"
               "    carbon_2d_diag_ = REXCVAR_GET(carbon_2d_diag);\n"
               "    carbon_2d_sinrecorte_ = REXCVAR_GET(carbon_2d_sinrecorte);\n"
               "    {\n"
               "      const std::string v = REXCVAR_GET(carbon_2d_vs);\n"
               "      if (v != carbon_2d_vs_texto_) {\n"
               "        carbon_2d_vs_texto_ = v;\n"
               "        carbon_2d_vs_.clear();\n"
               "        size_t ini = 0;\n"
               "        while (ini < v.size()) {\n"
               "          const size_t fin = std::min(v.find(',', ini), v.size());\n"
               "          const std::string t = v.substr(ini, fin - ini);\n"
               "          if (!t.empty()) {\n"
               "            carbon_2d_vs_.push_back(uint32_t(std::strtoul(t.c_str(), nullptr, 10)));\n"
               "          }\n"
               "          ini = fin + 1;\n"
               "        }\n"
               "        REXLOG_WARN(\"[carbon] 2D: {} vertex shaders in the list ('{}')\", carbon_2d_vs_.size(), v);\n"
               "      }\n"
               "      carbon_2d_activo_ = carbon_2d_diag_ || carbon_2d_sinrecorte_ || !carbon_2d_vs_.empty();\n"
               "    }\n"),
              ("carbon-2d-func",
               "  bool Reservar(VkDeviceSize bytes, VkDeviceSize alineacion, VkDeviceSize& offset) {\n",
               "  // carbon-2d-func: the kinds of draw seen, listed every 8 s.\n"
               "  void Registrar2D(uint32_t vs, int ps, bool sin_recorte, const VkViewport& viewport, bool elegido) {\n"
               "    carbon_2d_visto_[fmt::format(\"VS n{} PS n{} {} viewport {:.0f}x{:.0f} pass {}x{}{}\", vs, ps,\n"
               "                                  sin_recorte ? \"pixel-mode\" : \"clipped\", viewport.width,\n"
               "                                  std::abs(viewport.height), pase_ancho_, pase_alto_,\n"
               "                                  elegido ? \" [SQUEEZED]\" : \"\")]++;\n"
               "    const auto ahora = std::chrono::steady_clock::now();\n"
               "    if (ahora - carbon_2d_informe_ < std::chrono::seconds(8)) {\n"
               "      return;\n"
               "    }\n"
               "    carbon_2d_informe_ = ahora;\n"
               "    std::vector<std::pair<uint64_t, std::string>> orden;\n"
               "    for (const auto& kv : carbon_2d_visto_) {\n"
               "      orden.emplace_back(kv.second, kv.first);\n"
               "    }\n"
               "    std::sort(orden.begin(), orden.end(), [](const auto& a, const auto& b) { return a.first > b.first; });\n"
               "    REXLOG_WARN(\"[carbon] 2D draws, last 8 s ({} kinds):\", orden.size());\n"
               "    for (size_t i = 0; i < orden.size() && i < 40; ++i) {\n"
               "      REXLOG_WARN(\"[carbon] 2D  {:6} x  {}\", orden[i].first, orden[i].second);\n"
               "    }\n"
               "    carbon_2d_visto_.clear();\n"
               "  }\n\n"
               "  // Squeezes the output of a draw to the centre 16:9 of a pass wider than 16:9 (k = how much wider).\n"
               "  void Comprimir2D(bool sin_recorte, VkViewport& viewport, float ndc[4]) {\n"
               "    if (pase_alto_ == 0) {\n"
               "      return;\n"
               "    }\n"
               "    const float k = float(pase_ancho_) / (float(pase_alto_) * (16.0f / 9.0f));\n"
               "    if (!(k > 1.02f)) {\n"
               "      return;\n"
               "    }\n"
               "    if (sin_recorte) {  // x_out = x * ndc[0] + ndc[2]: scale the output about the centre\n"
               "      ndc[0] /= k;\n"
               "      ndc[2] /= k;\n"
               "    } else {  // clip space through the viewport: the viewport shrinks about the centre of the pass\n"
               "      const float centro = float(pase_ancho_) * 0.5f;\n"
               "      viewport.x = centro + (viewport.x - centro) / k;\n"
               "      viewport.width /= k;\n"
               "    }\n"
               "  }\n\n"
               "  bool Reservar(VkDeviceSize bytes, VkDeviceSize alineacion, VkDeviceSize& offset) {\n"),
              ("carbon-2d-draw",
               "    if (encuadre_vacio != 0) {\n      return true;  // empty viewport or scissor: as before\n    }\n",
               "    if (encuadre_vacio != 0) {\n      return true;  // empty viewport or scissor: as before\n    }\n"
               "    if (carbon_2d_activo_) {  // carbon-2d-draw\n"
               "      bool elegido = sin_recorte && carbon_2d_sinrecorte_;\n"
               "      for (uint32_t n : carbon_2d_vs_) {\n"
               "        elegido = elegido || n == uint32_t(p.vs->numero);\n"
               "      }\n"
               "      if (carbon_2d_diag_) {\n"
               "        Registrar2D(uint32_t(p.vs->numero), ps ? int(ps->numero) : -1, sin_recorte, viewport, elegido);\n"
               "      }\n"
               "      if (elegido) {\n"
               "        Comprimir2D(sin_recorte, viewport, ndc);\n"
               "      }\n"
               "    }\n"),
          ])
          PY

      - name: Patch - GSR 2 temporal upscaler (victorgbd's port, pinned) for Carbon
        shell: bash
        run: |
          set -euo pipefail
          MWDIR="$W/_gsr2_src"
          MW_SHA=3ac2fb698576d8889ade19660c38d0fd25f2c5a5
          if [ ! -f "$MWDIR/nativo/app/src/nfsmw_gsr2.cpp" ] || [ "$(git -C "$MWDIR" rev-parse HEAD 2>/dev/null)" != "$MW_SHA" ]; then
            rm -rf "$MWDIR"; mkdir -p "$MWDIR"
            git -C "$MWDIR" init -q
            git -C "$MWDIR" fetch -q --depth 1 https://github.com/victorgbd/NFSMW-Recompiled-Mobile.git "$MW_SHA"
            git -C "$MWDIR" checkout -q FETCH_HEAD
          fi
          python3 - "$W/nfsmw-android" "$GITHUB_WORKSPACE" "$MWDIR/nativo" <<'PY'
          #!/usr/bin/env python3
          """GSR 2 (victorgbd's port for Most Wanted) onto the pinned nfsmw-android + Carbon.
          usage: patch.py NFS_ROOT CARBON_ROOT MW_NATIVO_DIR
          Idempotent (marker carbon-gsr2), strict anchors (exactly one match or fail)."""
          import sys, os, shutil

          NFS, C, MW = sys.argv[1], sys.argv[2], sys.argv[3]
          APP = NFS + "/app/src"
          SDK = NFS + "/sdk"


          def rd(p):
              return open(p, encoding="utf-8").read()


          def wr(p, s):
              open(p, "w", encoding="utf-8").write(s)


          def once(s, old, new, what):
              n = s.count(old)
              if n != 1:
                  sys.exit("ANCHOR %s: expected 1, found %d" % (what, n))
              return s.replace(old, new)


          # carbon-gsr2: the frame bracket (block comments only: nothing here starts a line with "//")
          HOOK_BLOCK = r"""
          /* carbon-gsr2: one camera and one jitter phase per frame. sub_82453428 is the render thread's main loop (init, then a
             loop that calls sub_82453048 once per frame with the elapsed time; nothing else calls it): that call is one frame.
             Inside it: sub_82452E70 -> sub_8250AD38 -> sub_8250AE40 -> sub_822CEC80 (the views' update). */
          REX_EXTERN(__imp__sub_82453048);
          REX_HOOK_RAW(sub_82453048) {
            nfsmw::gsr2::EmpezarLlenado();
            __imp__sub_82453048(ctx, base);
            nfsmw::gsr2::TerminarLlenado();
          }
          """

          # ---------------------------------------------------------------- 1. files from victorgbd's repo
          for rel in ("app/src/nfsmw_gsr2.cpp", "app/src/nfsmw_gsr2.h",
                      "app/src/shaders/nfsmw_sgsr2_convertir_ps.h", "app/src/shaders/nfsmw_sgsr2_escalar_ps.h"):
              src = MW + "/" + rel
              if not os.path.isfile(src):
                  sys.exit("missing in victorgbd's checkout: " + src)
          os.makedirs(APP + "/shaders", exist_ok=True)
          g = APP + "/nfsmw_gsr2.cpp"
          if os.path.exists(g) and "carbon-gsr2" in rd(g):
