name: Build Carbon Android (arm64 runner)

on:
  workflow_dispatch:
    inputs:
      install_system_packages:
        description: "apt install deps + LLVM 20 (needs passwordless sudo)"
        type: boolean
        default: false
      skip_codegen:
        description: "Reuse generated/ from the previous run on this runner"
        type: boolean
        default: false
      upload_apk:
        description: "Upload the APK as an artifact (visible to anyone who can see the repo)"
        type: boolean
        default: false
      validation_layer:
        description: "TEST BUILD: bundle the Khronos Vulkan validation layer (bigger and slower APK)"
        type: boolean
        default: false

concurrency:
  group: carbon-android-arm64
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Pinned by the Carbon README
  NFSMW_ANDROID_REPO: https://github.com/codepdbh/nfsmw-android.git
  NFSMW_ANDROID_SHA: a7e6e4c3ca71064d0eea56d91fcc8aaf63418fc7
  XEX_SHA256: b1e423914f5feb0871c8903aded4d86852d34be3b831b42f5c6473c7c7304221
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.30.5
  # Google only ships x86_64 NDK / aapt2 for Linux, so these are community aarch64 builds
  NDK_URL: https://github.com/HomuHomu833/android-ndk-custom/releases/download/r28/android-ndk-r28c-aarch64-linux-musl.tar.xz
  AAPT2_SDK_URL: https://github.com/HomuHomu833/android-sdk-custom/releases/download/35.0.2/android-sdk-aarch64-linux-musl.tar.xz
  # sdkmanager is pure Java, so the official zip works on arm64
  CMDLINE_TOOLS_URL: https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
  # Runner-local paths
  GAME_DIR: ${{ vars.NFSC_GAME_DIR || '/opt/nfsc/game' }}
  DUMP_FILE: ${{ vars.NFSC_DUMP_FILE || '/opt/nfsc/carbon-82000000.bin' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: [self-hosted, linux, ARM64]
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # keep ignored files (generated/, out/) so skip_codegen works
          clean: false

      - name: Preflight (arch, game copy, disk, memory)
        run: |
          [ "$(uname -m)" = "aarch64" ] || { echo "::error::Runner is $(uname -m), expected aarch64"; exit 1; }

          W="$(dirname "$GITHUB_WORKSPACE")"
          TOOLS="$W/_tools"
          mkdir -p "$TOOLS" "$W/_out"

          if [ ! -f "$GAME_DIR/default.xex" ]; then
            echo "::error::$GAME_DIR/default.xex not found. Put your extracted Xbox 360 copy on the runner and set repo variable NFSC_GAME_DIR."
            exit 1
          fi
          actual="$(sha256sum "$GAME_DIR/default.xex" | cut -d' ' -f1)"
          if [ "$actual" != "$XEX_SHA256" ]; then
            echo "::error::default.xex SHA-256 mismatch (got $actual). The recompiled code only matches the tested PAL English copy."
            exit 1
          fi
          echo "default.xex OK (matches tested copy)"

          if [ -f "$DUMP_FILE" ]; then echo "Memory dump found: will run small-entry recovery"
          else echo "::warning::No memory dump at $DUMP_FILE. Small-entry recovery will be skipped."; fi

          avail_gb="$(df -BG --output=avail "$W" | tail -1 | tr -dc '0-9')"
          [ "$avail_gb" -ge 30 ] || echo "::warning::Only ${avail_gb} GB free on the runner disk"

          mem_gb="$(awk '/MemTotal/ {printf "%d", $2/1024/1024}' /proc/meminfo)"
          jobs=$(( mem_gb / 2 ))
          [ "$jobs" -gt "$(nproc)" ] && jobs="$(nproc)"
          [ "$jobs" -lt 1 ] && jobs=1
          echo "RAM ${mem_gb} GB, using ${jobs} parallel jobs"

          {
            echo "W=$W"
            echo "TOOLS=$TOOLS"
            echo "SDK_DIR=$W/nfsmw-android/sdk"
            echo "ANDROID_HOME=$TOOLS/android-sdk"
            echo "ANDROID_SDK_ROOT=$TOOLS/android-sdk"
            echo "JOBS=$jobs"
          } >> "$GITHUB_ENV"

      - name: Install system packages (optional)
        if: inputs.install_system_packages
        run: |
          sudo -n true 2>/dev/null || { echo "::error::Passwordless sudo is not available. Install the packages manually."; exit 1; }
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential git curl ca-certificates unzip zip xz-utils file wget gnupg lsb-release \
            software-properties-common python3 python3-venv python3-pip ninja-build pkg-config \
            openjdk-17-jdk-headless libvulkan-dev libx11-dev libxcb1-dev libwayland-dev libxkbcommon-dev
          if ! command -v clang-20 >/dev/null; then
            curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
            chmod +x "$RUNNER_TEMP/llvm.sh"
            sudo "$RUNNER_TEMP/llvm.sh" 20
          fi

      - name: Check host tools
        run: |
          missing=()
          for c in git curl unzip xz file python3 ninja java javac clang-20 clang++-20; do
            command -v "$c" >/dev/null || missing+=("$c")
          done
          python3 -c 'import venv, ensurepip' 2>/dev/null || missing+=("python3-venv")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing on the runner: ${missing[*]}. Re-run with install_system_packages=true or install them."
            exit 1
          fi
          major="$(java -version 2>&1 | sed -n '1s/.*version "\([0-9]*\).*/\1/p')"
          [ "${major:-0}" -ge 17 ] || { echo "::error::JDK 17+ required (found ${major:-none})"; exit 1; }
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          clang++-20 --version | head -1
          java -version 2>&1 | head -1

      - name: Python env (capstone etc.)
        run: |
          python3 -m venv "$TOOLS/venv"
          "$TOOLS/venv/bin/pip" install --quiet --upgrade pip
          "$TOOLS/venv/bin/pip" install --quiet -r requirements.txt
          echo "$TOOLS/venv/bin" >> "$GITHUB_PATH"

      - name: CMake 3.30.5 (arm64) and ninja wrapper
        run: |
          CM_DIR="$TOOLS/cmake-$CMAKE_VERSION"
          if [ ! -x "$CM_DIR/bin/cmake" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/cmake.tgz" \
              "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}-linux-aarch64.tar.gz"
            rm -rf "$CM_DIR"; mkdir -p "$CM_DIR"
            tar -xzf "$RUNNER_TEMP/cmake.tgz" -C "$CM_DIR" --strip-components=1
            rm -f "$RUNNER_TEMP/cmake.tgz"
          fi
          # Kitware's tarball has no ninja. Wrap the system one so Gradle's CMake
          # runs respect the memory-based job limit.
          REAL_NINJA="$(PATH=/usr/local/bin:/usr/bin:/bin command -v ninja)"
          printf '#!/usr/bin/env bash\nexec "%s" -j "${NINJA_JOBS:-%s}" "$@"\n' "$REAL_NINJA" "$JOBS" > "$CM_DIR/bin/ninja"
          chmod +x "$CM_DIR/bin/ninja"
          # AGP looks for the SDK-managed CMake in $ANDROID_HOME/cmake/<version>
          mkdir -p "$ANDROID_HOME/cmake"
          ln -sfn "$CM_DIR" "$ANDROID_HOME/cmake/$CMAKE_VERSION"
          echo "$CM_DIR/bin" >> "$GITHUB_PATH"
          "$CM_DIR/bin/cmake" --version | head -1

      - name: Android SDK (platform 35)
        run: |
          mkdir -p "$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKM" ]; then
            curl -fL --retry 3 -o "$RUNNER_TEMP/cmdtools.zip" "$CMDLINE_TOOLS_URL"
            rm -rf "$RUNNER_TEMP/cmdtools"; mkdir -p "$RUNNER_TEMP/cmdtools"
            unzip -q "$RUNNER_TEMP/cmdtools.zip" -d "$RUNNER_TEMP/cmdtools"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv "$RUNNER_TEMP/cmdtools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
            rm -rf "$RUNNER_TEMP/cmdtools" "$RUNNER_TEMP/cmdtools.zip"
          fi
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"

      - name: aarch64 aapt2 (Google ships x86_64 only)
        run: |
          AAPT2_DIR="$TOOLS/aapt2-arm64"
          if [ ! -x "$AAPT2_DIR/aapt2" ]; then
            dl="$RUNNER_TEMP/sdkdl"
            rm -rf "$dl"; mkdir -p "$dl" "$AAPT2_DIR"
            curl -fL --retry 3 -o "$dl/sdk.tar.xz" "$AAPT2_SDK_URL"
            tar -xJf "$dl/sdk.tar.xz" -C "$dl"
            found="$(find "$dl" -type f -name aapt2 | sort -V | tail -1)"
            [ -n "$found" ] || { echo "::error::No aapt2 inside $AAPT2_SDK_URL"; exit 1; }
            cp -a "$(dirname "$found")/." "$AAPT2_DIR/"
            chmod +x "$AAPT2_DIR/aapt2"
            rm -rf "$dl"
          fi
          file "$AAPT2_DIR/aapt2" | grep -q 'ARM aarch64' || { echo "::error::aapt2 is not an aarch64 binary"; exit 1; }
          "$AAPT2_DIR/aapt2" version
          echo "AAPT2=$AAPT2_DIR/aapt2" >> "$GITHUB_ENV"

      - name: Android NDK r28c (aarch64 host build) and smoke test
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [ ! -f "$NDK_DIR/source.properties" ]; then
            dl="$RUNNER_TEMP/ndk-dl"
            rm -rf "$dl"; mkdir -p "$dl" "$ANDROID_HOME/ndk"
            curl -fL --retry 3 -o "$dl/ndk.tar.xz" "$NDK_URL"
            tar -xJf "$dl/ndk.tar.xz" -C "$dl"
            src="$(find "$dl" -maxdepth 2 -name source.properties -printf '%h\n' | head -1)"
            [ -n "$src" ] || { echo "::error::source.properties not found in the NDK archive"; exit 1; }
            rm -rf "$NDK_DIR"; mv "$src" "$NDK_DIR"
            rm -rf "$dl"
          fi
          grep -Eq "^Pkg.Revision *= *$NDK_VERSION" "$NDK_DIR/source.properties" || {
            echo "::error::NDK revision is not $NDK_VERSION:"; cat "$NDK_DIR/source.properties"; exit 1; }

          # AGP/NDK expect the prebuilt dir to be called linux-x86_64
          PRE="$NDK_DIR/toolchains/llvm/prebuilt"
          if [ ! -e "$PRE/linux-x86_64" ]; then
            ln -s "$(ls -1 "$PRE" | head -1)" "$PRE/linux-x86_64"
          fi

          # Compile and link something for Android before spending an hour on the real build
          printf '#include <string>\nint main(){std::string s("ok");return (int)s.size()-2;}\n' > "$RUNNER_TEMP/t.cpp"
          "$PRE/linux-x86_64/bin/aarch64-linux-android35-clang++" -std=c++23 -O1 \
            "$RUNNER_TEMP/t.cpp" -o "$RUNNER_TEMP/t.out"
          file "$RUNNER_TEMP/t.out" | grep -q 'ARM aarch64' || { echo "::error::NDK smoke test produced a non-aarch64 binary"; exit 1; }
          echo "NDK smoke test OK"

      - name: nfsmw-android (pinned) and third-party fetch
        run: |
          cd "$W"
          if [ ! -d nfsmw-android/.git ]; then git clone "$NFSMW_ANDROID_REPO" nfsmw-android; fi
          git -C nfsmw-android fetch --tags origin
          git -C nfsmw-android checkout --force "$NFSMW_ANDROID_SHA"

          python - <<'PY'
          import pathlib, sys
          p = pathlib.Path("nfsmw-android/tools/fetch_thirdparty.py")
          text = p.read_text()
          if "carbon-ci-symlink-patch" in text:
              print("already patched"); sys.exit(0)
          old = (
              "                if resolved_target is not None:\n"
              "                    shutil.copy2(resolved_target, dst)\n"
              "                    if was_existing:\n"
              "                        kept += 1\n"
              "                    else:\n"
              "                        copied += 1\n"
              "                else:\n"
              "                    shutil.copy2(src, dst)\n"
              "                    copied += 1\n"
          )
          new = (
              "                if resolved_target is not None:\n"
              "                    shutil.copy2(resolved_target, dst)\n"
              "                    if was_existing:\n"
              "                        kept += 1\n"
              "                    else:\n"
              "                        copied += 1\n"
              "                elif os.path.islink(src) and not os.path.exists(src):\n"
              "                    # carbon-ci-symlink-patch: dangling submodule symlinks\n"
              "                    # (e.g. MoltenVK's Apple-only demo deps) are unused on Android.\n"
              "                    print(f'Skipping dangling symlink (unused on Android): {relative_path}')\n"
              "                else:\n"
              "                    shutil.copy2(src, dst)\n"
              "                    copied += 1\n"
          )
          if text.count(old) != 1:
              sys.exit(f"pattern not found exactly once ({text.count(old)} matches): fetch_thirdparty.py changed upstream?")
          p.write_text(text.replace(old, new))
          print("patched nfsmw-android/tools/fetch_thirdparty.py")
          PY

          stamp="nfsmw-android/.thirdparty-ok-$NFSMW_ANDROID_SHA"
          if [ ! -f "$stamp" ]; then
            python nfsmw-android/tools/fetch_thirdparty.py
            touch "$stamp"
          fi

      - name: Patch - widescreen v2 (carbon_widescreen auto-detect, carbon_aspect, Hor+ camera)
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/android/app/src/main/cpp/carbon_graphics.cpp" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, encoding="utf-8").read()
          if "carbon-ws2" in s:
              print("already patched")
              sys.exit(0)
          if "carbon-widescreen" in s:
              sys.exit("the OLD widescreen step already patched this file: remove it from the workflow and keep only this one")

          def once(old, new, what):
              global s
              n = s.count(old)
              if n != 1:
                  sys.exit("ANCHOR %s: expected 1, found %d" % (what, n))
              s = s.replace(old, new)

          once('#include "nfsmw_nativo_sistema.h"\n',
               '#include <cmath>\n#include <SDL3/SDL_video.h>\n#include "nfsmw_nativo_sistema.h"\n', "include")

          once('namespace {\nconstexpr uint32_t kRenderer = 0x82C65304;',
               '''// carbon-ws2: the game draws at the screen's proportion (scene mode width = height * carbon_aspect) and the
          // camera sees more at the sides (Hor+) instead of cropping top and bottom. HUD, menus and videos are stretched.
          REXCVAR_DEFINE_DOUBLE(carbon_aspect, 0.0, "Carbon/Android",
                                "Screen width / height (2.2222 on a 20:9 phone) to draw the game at that proportion, wider "
                                "view at the sides. 0 or below 1.9 = 16:9 like the Xbox 360. Up to 2.6. Needs carbon_single_pass")
              .lifecycle(rex::cvar::Lifecycle::kInitOnly);
          REXCVAR_DEFINE_BOOL(carbon_widescreen, false, "Carbon/Android",
                              "Draw the game at the screen's own proportion, read from the display (nothing happens on a 16:9 "
                              "screen). carbon_aspect, if set, wins over this")
              .lifecycle(rex::cvar::Lifecycle::kInitOnly);
          REXCVAR_DEFINE_BOOL(carbon_aspect_camera, true, "Carbon/Android",
                              "With carbon_aspect: widen the camera (Hor+). Off = same camera, only the picture is stretched")
              .lifecycle(rex::cvar::Lifecycle::kInitOnly);

          namespace {
          constexpr uint32_t kRenderer = 0x82C65304;''', "namespace")

          once('std::pair<uint32_t, uint32_t> Size() {',
               'std::pair<uint32_t, uint32_t> BaseSize() {', "Size def")

          once('void OutputSize(uint8_t* base) {',
               '''// The proportion to draw at (0 = plain 16:9): carbon_aspect, or the display's with carbon_widescreen. Decided once, at
          // the first call, so every size the game is given in a run agrees.
          double WideAspect() {
            static const double decided = []() -> double {
              const double manual = REXCVAR_GET(carbon_aspect);
              if (manual >= 1.9) return std::min(manual, 2.6);
              if (!REXCVAR_GET(carbon_widescreen)) return 0.0;
              const SDL_DisplayID display = SDL_GetPrimaryDisplay();
              const SDL_DisplayMode* mode = display ? SDL_GetCurrentDisplayMode(display) : nullptr;
              if (!mode || mode->w <= 0 || mode->h <= 0) {
                REXLOG_WARN("[carbon] widescreen: cannot read the display size, staying at 16:9 (use carbon_aspect)");
                return 0.0;
              }
              const double aspect = double(std::max(mode->w, mode->h)) / double(std::min(mode->w, mode->h));
              REXLOG_INFO("[carbon] widescreen: display {}x{} -> proportion {:.4f}{}", mode->w, mode->h, aspect,
                          aspect >= 1.9 ? "" : " (16:9 or narrower: the game as it is)");
              return aspect >= 1.9 ? std::min(aspect, 2.6) : 0.0;
            }();
            return decided;
          }
          std::pair<uint32_t, uint32_t> Size() {
            auto [width, height] = BaseSize();
            const double aspect = WideAspect();
            if (aspect >= 1.9 && REXCVAR_GET(carbon_single_pass))
              width = uint32_t(std::lround(double(height) * std::min(aspect, 2.6) / 32.0)) * 32u;
            return {width, height};
          }
          // How much wider than the 16:9 of the same height the scene is (1.25 for 1600x720); 1 = off.
          double WideFactor() {
            auto [width, height] = Size();
            const double k = double(width) / (double(height) * 16.0 / 9.0);
            return k > 1.02 ? k : 1.0;
          }
          void OutputSize(uint8_t* base) {''', "OutputSize")

          s += r'''
          // carbon-ws2: Hor+ camera. sub_822CEC80(r3 = view block, r4 = eView, f1 = ...) writes the projection at
          // block+64 and a copy at block+128 ([0][0] = 1 / tan(horizontal) at +0, [1][1] = -1 / tan(vertical) at +20), then calls
          // sub_822CEA90 (its only caller), which returns H (LOD / culling) for eView+16, and then multiplies the view by the
          // projection. The vertical angle is proportional to height / width of the view's render target (table 0x82C721D0,
          // 480 bytes per view id [eView+8], target object at +464 with width at +16 and height at +20; 640x480 if none).
          // For the views drawn at the wide size: [0][0] / k (wider), the vertical angle * k (back to the 16:9 one), H / k.
          namespace {
          thread_local uint32_t t_block = 0;
          thread_local uint32_t t_view = 0;

          uint32_t WRead32(const uint8_t* base, uint32_t address) {
            uint32_t v;
            std::memcpy(&v, base + address, sizeof(v));
            return __builtin_bswap32(v);
          }
          float WReadFloat(const uint8_t* base, uint32_t address) {
            const uint32_t v = WRead32(base, address);
            float f;
            std::memcpy(&f, &v, sizeof(f));
            return f;
          }
          void WWriteFloat(uint8_t* base, uint32_t address, float f) {
            uint32_t v;
            std::memcpy(&v, &f, sizeof(v));
            v = __builtin_bswap32(v);
            std::memcpy(base + address, &v, sizeof(v));
          }
          bool CameraCodeIsCarbon(const uint8_t* base) {
            static int state = 0;  // 0 not checked, 1 ok, 2 different
            if (!state) {
              state = (WRead32(base, 0x822CEC80) == 0x7D8802A6 && WRead32(base, 0x822CEC84) == 0x484CC2A5) ? 1 : 2;
              if (state == 2) REXLOG_WARN("[carbon] widescreen camera: sub_822CEC80 is not the expected code, camera not changed");
            }
            return state == 1;
          }
          // k for this view (1 = leave it), from the size of the view's target.
          double WideViewFactor(const uint8_t* base, uint32_t view) {
            const double k = WideFactor();
            if (k <= 1.0) return 1.0;
            const uint32_t id = WRead32(base, view + 8);
            if (id > 255) return 1.0;
            const uint32_t target = WRead32(base, 0x82C721D0 + 480 * id + 464);
            const uint32_t width = target ? WRead32(base, target + 16) : 640;
            const uint32_t height = target ? WRead32(base, target + 20) : 480;
            auto [wide_width, wide_height] = Size();
            const double wanted = double(wide_width) / double(wide_height);
            static uint64_t seen = 0;
            if (id < 64 && !(seen & (uint64_t(1) << id))) {
              seen |= uint64_t(1) << id;
              REXLOG_INFO("[carbon] widescreen: view {} target {}x{} (wide scene {}x{}, k {:.4f})", id, width, height,
                          wide_width, wide_height, k);
            }
            if (height == 0 || std::fabs(double(width) / double(height) - wanted) > wanted * 0.05) return 1.0;
            if (width != wide_width && width * 2 != wide_width && width * 4 != wide_width) return 1.0;
            return k;
          }
          void WideProjection(uint8_t* base, uint32_t projection, double k) {
            const float sx = WReadFloat(base, projection + 0);
            const float sy = WReadFloat(base, projection + 20);
            if (!(sx > 0.0f) || sy == 0.0f || !std::isfinite(sx) || !std::isfinite(sy)) return;
            const double vertical = std::min(std::atan(1.0 / std::fabs(double(sy))) * k, 1.55);  // under 89 degrees
            WWriteFloat(base, projection + 0, float(double(sx) / k));
            WWriteFloat(base, projection + 20, float(std::copysign(1.0 / std::tan(vertical), double(sy))));
          }
          }  // namespace

          REX_EXTERN(__imp__sub_822CEC80);
          REX_HOOK_RAW(sub_822CEC80) {
            t_block = ctx.r3.u32;
            t_view = ctx.r4.u32;
            __imp__sub_822CEC80(ctx, base);
            t_block = 0;
            t_view = 0;
          }

          REX_EXTERN(__imp__sub_822CEA90);
          REX_HOOK_RAW(sub_822CEA90) {
            __imp__sub_822CEA90(ctx, base);
            if (t_block && t_view && verified && REXCVAR_GET(carbon_aspect_camera) && CameraCodeIsCarbon(base)) {
              const double k = WideViewFactor(base, t_view);
              if (k > 1.0) {
                WideProjection(base, t_block + 64, k);
                WideProjection(base, t_block + 128, k);
                ctx.f1.f64 /= k;  // H as at 16:9: the same LOD and culling distances
                static int logged = 0;
                if (logged++ < 4) REXLOG_INFO("[carbon] widescreen camera: view block {:08X} corrected, k {:.4f}", t_block, k);
              }
            }
          }
          '''
          open(p, "w", encoding="utf-8").write(s)
          print("patched")
          PY

      - name: Patch - blur strength (c173 / cvBlurParams) scale, limit and override in the native renderer
        shell: bash
        run: |
          set -euo pipefail
          NFS="$(dirname "$GITHUB_WORKSPACE")/nfsmw-android"
          python3 - "$NFS/app/src" <<'PY'
          import sys

          root = sys.argv[1]  # nfsmw-android/app/src


          def patch(path, edits):
              s = open(path, encoding="utf-8").read()
              for marker, old, new in edits:
                  if marker in s:
                      print("ya aplicado:", marker)
                      continue
                  n = s.count(old)
                  if n != 1:
                      sys.exit("ANCLA NO ENCONTRADA (%d veces) para %s: %r" % (n, marker, old[:60]))
                  s = s.replace(old, new, 1)
                  print("aplicado:", marker)
              open(path, "w", encoding="utf-8").write(s)


          D = root + "/nfsmw_nativo_dibujos.cpp"
          patch(D, [
              ("carbon-c173-inc", "#include <cmath>\n", "#include <cmath>\n#include <cstdlib>  // carbon-c173-inc\n"),
              ("carbon-c173-cvar",
               '"se graban (solo pruebas, para localizar un dibujo)");\n',
               '"se graban (solo pruebas, para localizar un dibujo)");\n'
